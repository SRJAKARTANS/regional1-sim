<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalender Event - SIMGROUP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body class="bg-[#0A262C] text-white flex min-h-screen font-sans">

    <!-- Sidebar yang Lebih Elegan -->
    <aside class="w-64 bg-[#0d5360] p-6 border-r border-white/10 flex flex-col shadow-2xl">
        <div class="flex items-center space-x-3 mb-10">
            <div class="bg-teal-500/20 p-2 rounded-xl"><i data-lucide="layers" class="text-teal-300 w-6 h-6"></i></div>
            <span class="text-xl font-bold tracking-widest text-white">SIMGROUP</span>
        </div>
        <nav class="space-y-3 flex-1">
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/10 transition"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Dashboard</span></a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/10 transition"><i data-lucide="trending-up" class="w-5 h-5"></i><span>Growth & Drowning</span></a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-teal-600/30 text-white shadow-inner font-semibold border border-teal-500/30"><i data-lucide="calendar" class="w-5 h-5 text-teal-300"></i><span>Calendar of Event</span></a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/10 transition"><i data-lucide="activity" class="w-5 h-5"></i><span>Status SO Berjalan</span></a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/10 transition"><i data-lucide="database" class="w-5 h-5"></i><span>Bank Buffer Management</span></a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/10 transition"><i data-lucide="clock" class="w-5 h-5"></i><span>Timeline Kegiatan</span></a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/10 transition"><i data-lucide="file-text" class="w-5 h-5"></i><span>Report Media Partner</span></a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-10 bg-gradient-to-br from-[#116A7B] to-[#0A262C]">
        <header class="flex justify-between items-end mb-10 border-b border-white/10 pb-6">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight">Calendar of Event</h1>
                <p class="text-teal-200/70 mt-2 font-medium">Monitoring agenda operasional wilayah Jakarta</p>
            </div>
            <button id="sync-btn" class="bg-teal-500 hover:bg-teal-600 text-white px-8 py-3 rounded-2xl font-bold transition-all shadow-lg flex items-center gap-2 transform hover:scale-105 active:scale-95">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                <span id="sync-text">Sinkronkan Calendar</span>
            </button>
        </header>

        <div id="agenda-event-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Kartu Kosong Awal -->
            <div class="col-span-full border-2 border-dashed border-white/10 rounded-3xl p-12 text-center flex flex-col items-center">
                <div class="bg-white/5 p-4 rounded-full mb-4">
                    <i data-lucide="calendar-search" class="w-8 h-8 text-teal-400"></i>
                </div>
                <h3 class="text-xl font-bold">Siap Sinkronisasi</h3>
                <p class="text-teal-200/60 max-w-sm mt-2">Tekan tombol di atas untuk menarik data terbaru dari Google Calendar Anda.</p>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const CLIENT_ID = 'MASUKKAN_CLIENT_ID_BARU_DISINI'; 
        const SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
        let tokenClient;

        window.onload = () => {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPE,
                prompt: 'select_account',
                callback: (resp) => { if (resp.error) return; fetchCalendarEvents(); },
            });
            gapi.load('client', async () => {
                await gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'] });
            });
            document.getElementById('sync-btn').onclick = () => tokenClient.requestAccessToken({ login_hint: 'sr.dkijakarta01@gmail.com' });
        };

        async function fetchCalendarEvents() {
            document.getElementById('sync-text').innerText = 'Sinkronisasi...';
            try {
                const response = await gapi.client.calendar.events.list({
                    'calendarId': 'sr.dkijakarta01@gmail.com',
                    'timeMin': new Date().toISOString(),
                    'singleEvents': true,
                    'orderBy': 'startTime'
                });
                
                const events = response.result.items;
                const container = document.getElementById('agenda-event-list');
                container.innerHTML = events.length > 0 
                    ? events.map(e => `
                        <div class="bg-white/95 text-slate-800 p-6 rounded-3xl shadow-xl hover:shadow-2xl transition-all hover:scale-[1.02] border-l-8 border-teal-500">
                            <h3 class="font-bold text-xl text-slate-900">${e.summary}</h3>
                            <div class="mt-4 flex items-center text-sm text-slate-500 gap-2">
                                <i data-lucide="calendar" class="w-4 h-4"></i>
                                <span>${new Date(e.start.dateTime || e.start.date).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' })}</span>
                            </div>
                            <div class="mt-1 flex items-center text-sm text-slate-500 gap-2">
                                <i data-lucide="clock" class="w-4 h-4"></i>
                                <span>${new Date(e.start.dateTime || e.start.date).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} WIB</span>
                            </div>
                        </div>`).join('')
                    : "<p class='text-center'>Tidak ada agenda dalam waktu dekat.</p>";
                document.getElementById('sync-text').innerText = 'Data Terupdate';
                lucide.createIcons();
            } catch (err) {
                alert("Gagal mengambil data. Pastikan Client ID sudah benar dan email masuk di Test Users.");
            }
        }
    </script>
</body>
</html>
