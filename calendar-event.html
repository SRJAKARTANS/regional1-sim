<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Event - SIMGROUP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script async defer src="https://apis.google.com/js/api.js"></script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
</head>
<body class="bg-[#116A7B] text-white flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#0d5360] p-6 border-r border-white/10 shrink-0">
        <div class="flex items-center space-x-3 mb-8">
            <div class="bg-white/10 p-2 rounded-lg"><i data-lucide="layers" class="text-teal-300 w-6 h-6"></i></div>
            <span class="text-xl font-bold tracking-wider">SIMGROUP</span>
        </div>
        <nav class="space-y-2">
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/5">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Dashboard</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/5">
                <i data-lucide="trending-up" class="w-5 h-5"></i><span>Growth & Drowning</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-white/10 text-white font-medium">
                <i data-lucide="calendar" class="w-5 h-5 text-teal-300"></i><span>Calendar of Event</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/5">
                <i data-lucide="activity" class="w-5 h-5"></i><span>Status SO Berjalan</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/5">
                <i data-lucide="database" class="w-5 h-5"></i><span>Bank Buffer Management</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/5">
                <i data-lucide="clock" class="w-5 h-5"></i><span>Timeline Kegiatan</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-teal-100 hover:bg-white/5">
                <i data-lucide="file-text" class="w-5 h-5"></i><span>Report Media Partner</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">Calendar of Event</h1>
            <button id="sync-btn" class="bg-emerald-600 px-6 py-3 rounded-xl font-bold hover:bg-emerald-700 transition flex items-center gap-2">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                <span id="sync-text">Sinkronkan Google Calendar</span>
            </button>
        </header>

        <div id="agenda-event-list" class="space-y-4">
            <p class="text-teal-200">Klik tombol sinkronisasi untuk menarik jadwal dari sr.dkijakarta01@gmail.com</p>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const CLIENT_ID = '271685278113-ib7etfbpre91r5v49no5gcfevrrdn256.apps.googleusercontent.com';
        const SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
        let tokenClient;

        window.onload = () => {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPE,
                prompt: 'select_account',
                callback: (tokenResponse) => {
                    if (tokenResponse.error) return;
                    fetchCalendarEvents();
                },
            });
            gapi.load('client', async () => {
                await gapi.client.init({ discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'] });
            });
            document.getElementById('sync-btn').onclick = () => tokenClient.requestAccessToken();
        };

        async function fetchCalendarEvents() {
            document.getElementById('sync-text').innerText = 'Menarik Data...';
            try {
                const response = await gapi.client.calendar.events.list({
                    'calendarId': 'sr.dkijakarta01@gmail.com',
                    'timeMin': new Date().toISOString(),
                    'singleEvents': true,
                    'orderBy': 'startTime'
                });
                
                const events = response.result.items;
                const container = document.getElementById('agenda-event-list');
                container.innerHTML = events.length > 0 
                    ? events.map(e => `
                        <div class="bg-white text-slate-800 p-4 rounded-xl shadow border-l-4 border-emerald-500">
                            <h3 class="font-bold text-lg">${e.summary}</h3>
                            <p class="text-sm text-slate-500">${new Date(e.start.dateTime || e.start.date).toLocaleString('id-ID')}</p>
                        </div>`).join('')
                    : "<p>Tidak ada jadwal mendatang.</p>";
                document.getElementById('sync-text').innerText = 'Sinkronisasi Selesai';
            } catch (err) {
                alert("Gagal mengambil data. Pastikan akun sudah diizinkan.");
            }
        }
    </script>
</body>
</html>
