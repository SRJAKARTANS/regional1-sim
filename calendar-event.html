<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar of Event - SIMGROUP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#148e9e',
                        secondary: '#0d6470',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-primary text-white p-6 hidden md:block">
            <div class="flex items-center mb-10">
                <span class="text-xl font-bold tracking-tight">SIMGROUP</span>
            </div>
            
            <nav class="space-y-2">
                <a href="dashboard-internal.html" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-secondary transition duration-200">
                    <i class="fas fa-arrow-left"></i>
                    <span>Kembali ke Dashboard</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <header class="mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Calendar of Events</h1>
                <p class="text-gray-500">Daftar kegiatan dan acara SIMGROUP</p>
            </header>

            <div id="event-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-gray-500">Memuat data acara...</p>
            </div>
        </main>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz0Ts_F69ZrKJ_6Bkeh52Z37fKQJ1b_HBeiozLb74yxJzwqMdf9NVz9WMFVGAVO7bcyyg/exec";

        async function loadGoogleCalendar() {
            const container = document.getElementById('event-container');
            
            try {
                const response = await fetch(API_URL);
                const events = await response.json();
                
                container.innerHTML = ''; // Bersihkan loading

                if (!events || events.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center py-10 text-gray-400">Belum ada acara mendatang.</p>';
                    return;
                }

                events.forEach(event => {
                    const cardHTML = `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
                            <span class="text-[11px] font-bold text-primary uppercase bg-teal-50 px-3 py-1 rounded-full mb-3 self-start">${event.date || 'Tanggal tidak tersedia'}</span>
                            <h3 class="font-bold text-gray-800 text-lg leading-snug mb-3">${event.title}</h3>
                            <p class="text-sm text-gray-600 mb-2"><i class="fas fa-map-marker-alt mr-2 text-gray-400"></i> ${event.location || 'Lokasi tidak tersedia'}</p>
                            <p class="text-sm text-gray-500 mt-auto pt-4 border-t border-gray-100">${event.description || ''}</p>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
            } catch (error) {
                console.error("Gagal mengambil data:", error);
                container.innerHTML = '<p class="text-red-500">Gagal memuat acara. Pastikan Google Script Anda sudah di-deploy dengan akses "Anyone".</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadGoogleCalendar);
    </script>
</body>
</html>
