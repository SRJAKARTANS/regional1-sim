<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMGROUP Dashboard | Internal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .page-hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex text-slate-800">

    <aside id="sidebar" class="w-64 bg-[#094d57] text-white fixed md:relative h-full z-50 flex flex-col shadow-2xl transition-transform -translate-x-full md:translate-x-0">
        <div class="h-20 flex items-center justify-center border-b border-white/10 font-bold text-xl tracking-wider">
            <i class="fa-solid fa-building mr-2"></i> SIMGROUP
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1">
            <button onclick="switchPage('overview')" id="nav-overview" class="w-full flex items-center gap-3 px-4 py-3 bg-white/20 rounded-lg font-semibold transition-all">
                <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
            </button>
            <button onclick="switchPage('sostatus')" id="nav-sostatus" class="w-full flex items-center gap-3 px-4 py-3 hover:bg-white/10 rounded-lg transition-all">
                <i class="fa-solid fa-table-list w-5"></i> Detail SO
            </button>
        </nav>
        <div class="p-4 border-t border-white/10 text-center text-[10px] text-white/50">
            Internal Sourcing Portal v2.0
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-6 shadow-sm z-10">
            <h1 class="text-lg font-semibold text-slate-800">HR Monitoring Jakarta</h1>
            <div class="flex items-center gap-4 text-xs font-medium text-slate-500">
                <span id="syncStatus"><i class="fa-solid fa-circle text-[8px] animate-pulse text-emerald-500 mr-1"></i> Cloud Ready</span>
            </div>
        </header>

        <main id="page-overview" class="flex-1 overflow-y-auto p-6 bg-slate-50">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-xs font-semibold uppercase">Total SO Aktif</p>
                    <h3 class="text-2xl font-bold text-primary mt-1" id="stat-total">0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-xs font-semibold uppercase">Fulfillment Rate</p>
                    <h3 class="text-2xl font-bold text-emerald-600 mt-1" id="stat-fulfill">0%</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-xs font-semibold uppercase">Offering Rate</p>
                    <h3 class="text-2xl font-bold text-amber-500 mt-1" id="stat-offering">0%</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 mb-4">Fulfillment Chart</h3>
                    <canvas id="soFulfillChart" class="h-48"></canvas>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 mb-4">Offering Chart</h3>
                    <canvas id="soOfferingChart" class="h-48"></canvas>
                </div>
            </div>
        </main>

        <main id="page-sostatus" class="flex-1 overflow-hidden p-6 bg-slate-50 page-hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 h-full flex flex-col">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-slate-800">Data Service Order</h3>
                        <p class="text-xs text-slate-400 mt-1" id="updateInfo">Menunggu file Excel...</p>
                    </div>
                    <label class="cursor-pointer bg-primary text-white px-4 py-2 rounded-lg text-sm hover:bg-secondary transition-all">
                        <i class="fa-solid fa-file-excel mr-2"></i> Upload Excel/CSV
                        <input type="file" class="hidden" id="excelFile" accept=".xlsx, .xls, .csv">
                    </label>
                </div>
                <div class="flex-1 overflow-auto">
                    <table class="w-full text-left border-collapse" id="soTable">
                        <thead class="bg-slate-50 sticky top-0">
                            <tr class="text-slate-500 text-xs uppercase">
                                <th class="p-4">Klien</th>
                                <th class="p-4">Posisi</th>
                                <th class="p-4">Area</th>
                                <th class="p-4 text-center">Fulfillment</th>
                                <th class="p-4 text-center">Offering</th>
                            </tr>
                        </thead>
                        <tbody id="so-tbody" class="divide-y divide-slate-100">
                            <tr><td colspan="5" class="p-10 text-center text-slate-400">Silakan upload data hari ini</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi (Sesuaikan dengan milik Anda)
        const firebaseConfig = { /* isi config Anda di sini */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- STANDARDISASI DATA ---
        // Fungsi ini memetakan berbagai nama kolom dari Excel departemen lain ke format standar kita
        function standardizeData(data) {
            return data.map(row => {
                const newRow = {};
                // Mapping key (Tambahkan variasi nama kolom dari departemen lain di sini)
                newRow.client = row['nama client'] || row['Client'] || row['Nama Klien'] || '-';
                newRow.job = row['nama job'] || row['Job'] || row['Posisi'] || '-';
                newRow.area = row['area'] || row['Area'] || '-';
                newRow.finish = parseInt(row['finish'] || row['Finish'] || 0);
                newRow.unfulfill = parseInt(row['unfulfill'] || row['Unfulfill'] || 0);
                newRow.offering = parseInt(row['OFFERING'] || row['Offering'] || 0);
                return newRow;
            });
        }

        // --- HANDLER UPLOAD ---
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils
