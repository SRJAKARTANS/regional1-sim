<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Internal - SIMGROUP JAKARTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#148e9e', secondary: '#0d6470', glass: 'rgba(255, 255, 255, 0.08)', glassBorder: 'rgba(255, 255, 255, 0.15)' } } }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-primary to-secondary h-screen overflow-hidden flex text-slate-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-glass backdrop-blur-xl border-r border-glassBorder hidden md:flex flex-col z-20">
        <div class="h-20 flex items-center justify-center border-b border-glassBorder text-white font-bold text-xl tracking-wider">
            <i class="fa-solid fa-building mr-2"></i> SIMGROUP
        </div>
        <div class="flex-1 overflow-y-auto py-4">
            <nav class="space-y-1.5 px-3">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-white/20 text-white rounded-lg font-semibold"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/10 rounded-lg"><i class="fa-solid fa-arrow-trend-up w-5"></i> Growth & Drowning</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/10 rounded-lg"><i class="fa-regular fa-calendar-check w-5"></i> Calendar of Event</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/10 rounded-lg"><i class="fa-solid fa-database w-5"></i> Bank Buffer Management</a>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <main class="flex-1 overflow-y-auto p-6 lg:p-10">
            <h2 class="text-2xl font-bold text-white mb-6">Monitoring Data Operasional</h2>

            <!-- Chart Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-xl">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-800">Status SO (Fulfillment)</h3>
                        <label id="upload-section" class="cursor-pointer bg-primary text-white text-xs px-3 py-1 rounded-lg">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Sync CSV
                            <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileUpload(event)">
                        </label>
                    </div>
                    <canvas id="soFulfillChart" class="h-40"></canvas>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-xl">
                    <h3 class="font-bold text-slate-800 mb-4">Status SO (Offering)</h3>
                    <canvas id="soOfferingChart" class="h-40"></canvas>
                </div>
            </div>

            <!-- Detail Table -->
            <div class="bg-white p-6 rounded-2xl shadow-xl">
                <h3 class="font-bold text-slate-800 mb-4">Detail Data & Due Date</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead><tr class="text-slate-400 border-b"><th class="py-2">ID</th><th class="py-2">Due Date</th><th class="py-2">Status</th></tr></thead>
                        <tbody id="data-table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let fulfillChart, offeringChart;

        function initDashboard() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const uploadSection = document.getElementById('upload-section');
            if (user && (user.username === 'daffa' || user.username === 'simon')) {
                uploadSection.style.display = 'block';
            } else {
                uploadSection.style.display = 'none';
            }
        }

        window.onload = () => {
            initDashboard();
            const cached = localStorage.getItem('cachedCSVData');
            if (cached) processData(JSON.parse(cached));
        };

        function handleFileUpload(e) {
            const file = e.target.files[0];
            Papa.parse(file, { header: true, complete: (res) => {
                localStorage.setItem('cachedCSVData', JSON.stringify(res.data));
                processData(res.data);
            }});
        }

        function processData(data) {
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = '';
            
            data.slice(0, 5).forEach(row => {
                tbody.innerHTML += `<tr class="border-b">
                    <td class="py-2">${row.id || '-'}</td>
                    <td class="py-2">${row.due_date || '-'}</td>
                    <td class="py-2">${row.finish == 1 ? 'Selesai' : 'Proses'}</td>
                </tr>`;
            });

            // Update Chart
            soFulfillChart.data.datasets[0].data = [terFulfill, belumFulfill];
            soFulfillChart.update();
            soOfferingChart.data.datasets[0].data = [sudahOffering, belumOffering];
            soOfferingChart.update();
        }

        // Chart Instance
        const soFulfillChart = new Chart(document.getElementById('soFulfillChart').getContext('2d'), {
            type: 'doughnut', data: { labels: ['Fulfill', 'Belum'], datasets: [{ data: [1, 1], backgroundColor: ['#148e9e', '#f43f5e'] }] }, options: { responsive: true, maintainAspectRatio: false }
        });
        const soOfferingChart = new Chart(document.getElementById('soOfferingChart').getContext('2d'), {
            type: 'doughnut', data: { labels: ['Offering', 'Belum'], datasets: [{ data: [1, 1], backgroundColor: ['#10b981', '#fbbf24'] }] }, options: { responsive: true, maintainAspectRatio: false }
        });

        function handleLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
