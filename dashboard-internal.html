<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Internal - SIMGROUP JAKARTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border-right: 1px solid rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body class="bg-gradient-to-br from-[#148e9e] to-[#0d6470] h-screen overflow-hidden flex text-slate-800">

    <!-- Sidebar -->
    <aside class="w-64 glass hidden md:flex flex-col z-20">
        <div class="h-20 flex items-center justify-center border-b border-white/10 text-white font-bold text-xl">
            <i class="fa-solid fa-building mr-2"></i> SIMGROUP
        </div>
        <div class="flex-1 p-4 space-y-2">
            <a href="#status-so" class="flex items-center gap-3 px-4 py-3 bg-white/20 text-white rounded-lg font-semibold shadow-sm">
                <i class="fa-solid fa-clipboard-list w-5 text-center"></i> Status SO Berjalan
            </a>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Header -->
        <header class="h-20 bg-white/5 backdrop-blur-sm border-b border-white/10 flex items-center justify-between px-8 text-white shrink-0">
            <h1 class="text-xl font-semibold">Overview <span class="text-sm text-white/60 ml-2">| Monitoring Team Jakarta</span></h1>
            <div class="flex items-center gap-4">
                <!-- Tombol Upload CSV yang bisa diakses -->
                <label class="cursor-pointer bg-white text-[#148e9e] px-4 py-2 rounded-lg text-sm font-bold shadow-lg hover:bg-slate-100 transition">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload CSV
                    <input type="file" id="csvUpload" accept=".csv" class="hidden">
                </label>
                <img src="https://ui-avatars.com/api/?name=Daffa&background=ffffff&color=148e9e" class="w-10 h-10 rounded-full ring-2 ring-white/30" alt="Profile">
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="flex-1 overflow-y-auto p-6 lg:p-10 z-0">
            <div id="status-so" class="bg-white rounded-2xl shadow-xl flex flex-col h-[80vh] overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
                    <h2 class="font-bold text-lg text-slate-800"><i class="fa-solid fa-table-list text-[#148e9e] mr-2"></i> Detail Status SO Berjalan</h2>
                    <span id="last-updated" class="text-xs text-slate-500 font-medium">Menunggu autentikasi database...</span>
                </div>
                
                <!-- Table Details -->
                <div class="overflow-x-auto flex-1 p-0">
                    <table class="w-full text-sm text-left whitespace-nowrap" id="so-table">
                        <thead class="sticky top-0 bg-white shadow-sm z-10">
                            <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                                <th class="p-4 font-semibold">No</th>
                                <th class="p-4 font-semibold">Klien & Posisi</th>
                                <th class="p-4 font-semibold">Area & Assign RO</th>
                                <th class="p-4 font-semibold">Tgl Approve</th>
                                <th class="p-4 font-semibold text-center">Fulfillment</th>
                                <th class="p-4 font-semibold text-center">Offering</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100" id="so-tbody">
                            <tr>
                                <td colspan="6" class="p-12 text-center text-slate-400">
                                    <i class="fa-solid fa-cloud-arrow-down animate-bounce text-3xl mb-3"></i>
                                    <p>Menghubungkan ke Cloud Database...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDKs & Logika Cloud -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration injected by Canvas
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'simgroup-jkt';

        // RULE 1: Jalur data Publik harus genap dan strictly mengikuti protocol artifacts/appId/public/data/namakoleksi/namadokumen
        const getDocRef = () => doc(db, 'artifacts', appId, 'public', 'data', 'soreport', 'latest_csv');

        // Fungsi Membangun UI Tabel dari Data Cloud
        window.renderDashboard = (data, timestamp) => {
            const tbody = document.getElementById('so-tbody');
            const lastUpdated = document.getElementById('last-updated');
            tbody.innerHTML = '';

            if (timestamp) {
                const date = new Date(timestamp);
                lastUpdated.innerText = "Terakhir diupdate: " + date.toLocaleString('id-ID');
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-500">Belum ada data CSV yang diunggah hari ini.</td></tr>';
                return;
            }

            let validCount = 0;
            data.forEach(row => {
                const finish = parseInt(row['finish']) || 0;
                const unfulfill = parseInt(row['unfulfill']) || 0;
                const offering = parseInt(row['OFFERING']) || 0;

                if (finish === 1 || unfulfill === 1) {
                    validCount++;
                    const client = row['nama client'] || '-';
                    const job = row['nama job'] || '-';
                    const area = row['area'] || '-';
                    const assignRo = row['ASSIGN RO'] || row['Assign RO'] || row['assign ro'] || '-';
                    const tglApprove = row['tgl approve'] || '-';

                    const fulfillBadge = finish === 1 
                        ? `<span class="bg-emerald-50 text-emerald-600 border border-emerald-200 text-xs px-2.5 py-1 rounded-full font-semibold"><i class="fa-solid fa-check mr-1"></i> Ter-Fulfill</span>`
                        : `<span class="bg-rose-50 text-rose-600 border border-rose-200 text-xs px-2.5 py-1 rounded-full font-semibold"><i class="fa-solid fa-hourglass-half mr-1"></i> Belum Fulfill</span>`;

                    const offeringBadge = offering > 0 
                        ? `<span class="bg-[#148e9e]/10 text-[#148e9e] border border-[#148e9e]/20 text-xs px-2.5 py-1 rounded-full font-semibold"><i class="fa-solid fa-file-signature mr-1"></i> Sudah Offering</span>`
                        : `<span class="bg-amber-50 text-amber-600 border border-amber-200 text-xs px-2.5 py-1 rounded-full font-semibold"><i class="fa-regular fa-clock mr-1"></i> Belum Offering</span>`;

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition-colors';
                    tr.innerHTML = `
                        <td class="p-4 text-center text-slate-400 font-medium">${validCount}</td>
                        <td class="p-4"><p class="font-bold text-slate-800">${client}</p><p class="text-slate-500 text-xs mt-0.5">${job}</p></td>
                        <td class="p-4"><p class="text-slate-700 font-medium">${area}</p><p class="text-slate-400 text-xs mt-0.5"><i class="fa-regular fa-user mr-1"></i>${assignRo}</p></td>
                        <td class="p-4 text-slate-600 text-sm">${tglApprove}</td>
                        <td class="p-4 text-center">${fulfillBadge}</td>
                        <td class="p-4 text-center">${offeringBadge}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });
        };

        // RULE 3: Selesaikan Autentikasi terlebih dahulu sebelum mengaktifkan Listener ke Cloud
        async function initApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // Setelah berhasil Autentikasi, periksa status user, lalu aktifkan Live Snapshot
                onAuthStateChanged(auth, (user) => {
                    if (!user) return;
                    
                    onSnapshot(getDocRef(), (docSnap) => {
                        if (docSnap.exists()) {
                            // Selalu parsing kembalian JSON string agar tidak memecahkan tipe data array bersarang di Firestore
                            const parsedData = JSON.parse(docSnap.data().csvData);
                            window.renderDashboard(parsedData, docSnap.data().timestamp);
                        } else {
                            document.getElementById('so-tbody').innerHTML = '<tr><td colspan="6" class="p-8 text-center text-slate-500">Belum ada data CSV. Silakan klik Upload CSV.</td></tr>';
                            document.getElementById('last-updated').innerText = "Belum ada file ditarik ke Cloud";
                        }
                    }, (err) => {
                        console.error("Firestore Listener Error:", err);
                        alert("Tidak memiliki ijin untuk membaca database. Silakan Refresh halaman.");
                    });
                });
            } catch (e) {
                console.error("Firebase Init Error:", e);
            }
        }

        // CSV Uploader: Unggah CSV dan Stringify ke JSON demi keamanan tipe data Array
        document.getElementById('csvUpload').addEventListener('change', function(event) {
            if (!auth.currentUser) return alert("Sistem masih melakukan proses otentikasi. Tunggu 2-3 detik lalu ulangi kembali.");
            const file = event.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true, 
                skipEmptyLines: true,
                complete: async function(results) {
                    try {
                        const dataStr = JSON.stringify(results.data);
                        // Push ke Cloud Firestore
                        await setDoc(getDocRef(), { csvData: dataStr, timestamp: Date.now() });
                        alert("✅ Data berhasil ditarik ke Cloud Database! Semua layar rekan tim kamu langsung ter-update otomatis.");
                    } catch (e) {
                        alert("❌ Error saat Upload ke Cloud. Periksa koneksi atau permissions: " + e.message);
                        console.error(e);
                    }
                }
            });
        });

        // Jalankan Inisialisasi Security & Realtime Reader
        initApp();
    </script>
</body>
</html>
