<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Internal - SIMGROUP JAKARTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#148e9e',
                        secondary: '#0d6470',
                        glass: 'rgba(255, 255, 255, 0.08)',
                        glassBorder: 'rgba(255, 255, 255, 0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="bg-gradient-to-br from-primary to-secondary h-screen overflow-hidden flex text-slate-800">

    <!-- Sidebar -->
    <aside class="w-64 bg-glass backdrop-blur-xl border-r border-glassBorder hidden md:flex flex-col z-20">
        <div class="h-20 flex items-center justify-center border-b border-glassBorder">
            <div class="flex items-center gap-2 text-white font-bold text-xl tracking-wider">
                <i class="fa-solid fa-building"></i>
                <span>SIMGROUP</span>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto py-4">
            <nav class="space-y-1.5 px-3">
                <a href="dashboard-internal.html" class="flex items-center gap-3 px-4 py-3 bg-white/20 text-white rounded-lg font-semibold transition-all">
                    <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/10 hover:text-white rounded-lg transition-all">
                    <i class="fa-solid fa-arrow-trend-up w-5"></i> Growth and Drowning
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/10 hover:text-white rounded-lg transition-all">
                    <i class="fa-regular fa-calendar-check w-5"></i> Calendar of Event
                </a>
                <a href="status-so-berjalan.html" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/10 hover:text-white rounded-lg transition-all">
                    <i class="fa-solid fa-clipboard-list w-5"></i> Status SO Berjalan
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/10 hover:text-white rounded-lg transition-all">
                    <i class="fa-solid fa-database w-5"></i> Bank Buffer Management
                </a>
                <a href="timeline-kegiatan.html" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/10 hover:text-white rounded-lg transition-all">
                    <i class="fa-solid fa-clock-rotate-left w-5"></i> Timeline Kegiatan
                </a>
                <a href="report-media-partner.html" class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/10 hover:text-white rounded-lg transition-all">
                    <i class="fa-solid fa-bullhorn w-5"></i> Report Media Partner
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-glassBorder">
            <button onclick="handleLogout()" class="flex items-center justify-center gap-2 w-full py-2.5 bg-rose-500/20 text-white rounded-lg hover:bg-rose-500/40 transition-all font-medium text-sm">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-20 bg-glass backdrop-blur-sm border-b border-glassBorder flex items-center justify-between px-10">
            <h1 class="text-xl font-semibold text-white">Overview <span class="text-sm font-light text-white/70 ml-2">| Monitoring Team Jakarta</span></h1>
            <div class="flex items-center gap-3 cursor-pointer group" id="user-profile">
                <div class="text-right">
                    <p class="text-sm font-semibold text-white" id="profile-name">Loading...</p>
                    <p class="text-xs text-white/70" id="profile-role">Loading...</p>
                </div>
                <img src="https://ui-avatars.com/api/?name=User&background=ffffff&color=148e9e" id="profile-avatar" alt="Profile" class="w-10 h-10 rounded-full shadow-lg">
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-10">
            <h2 class="text-3xl font-bold mb-8 text-white" id="welcome-greeting">Selamat Datang! ✨</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="font-bold text-slate-800">Status SO (Fulfillment)</h3>
                        <label id="syncCsvLabel" style="display: none;" class="cursor-pointer bg-slate-50 hover:bg-primary hover:text-white text-slate-600 text-xs px-3 py-1.5 rounded-lg border border-slate-200 transition-all shadow-sm">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Sync CSV
                            <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileUpload(event)">
                        </label>
                    </div>
                    <div class="relative h-36 w-full flex items-center justify-center flex-1">
                        <canvas id="soFulfillChart"></canvas>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col">
                    <h3 class="font-bold text-slate-800">Status SO (Offering)</h3>
                    <div class="relative h-36 w-full flex items-center justify-center flex-1">
                        <canvas id="soOfferingChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // INIT DATA DENGAN AMAN
        let activeUser = null;
        
        function initDashboard() {
            try {
                const userString = localStorage.getItem('currentUser');
                if (!userString) {
                    window.location.replace('login.html');
                    return;
                }
                activeUser = JSON.parse(userString);
                window.activeUser = activeUser;

                document.getElementById('profile-name').textContent = activeUser.name;
                document.getElementById('profile-role').textContent = activeUser.role;
                document.getElementById('profile-avatar').src = `https://ui-avatars.com/api/?name=${activeUser.name.replace(' ', '+')}&background=148e9e&color=fff`;
                
                document.getElementById('welcome-greeting').innerText = `Halo, ${activeUser.name}! ✨`;

                if (activeUser.name.toLowerCase() === 'daffa') {
                    document.getElementById('syncCsvLabel').style.display = 'flex';
                }
            } catch (e) {
                window.location.replace('login.html');
            }
        }

        window.handleLogout = () => {
            localStorage.removeItem('currentUser');
            window.location.replace('login.html');
        };

        // Inisialisasi Chart
        const soFulfillChart = new Chart(document.getElementById('soFulfillChart').getContext('2d'), {
            type: 'doughnut',
            data: { labels: ['Ter-Fulfill', 'Belum Fulfill'], datasets: [{ data: [1, 1], backgroundColor: ['#148e9e', '#f43f5e'] }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { display: false } } }
        });

        const soOfferingChart = new Chart(document.getElementById('soOfferingChart').getContext('2d'), {
            type: 'doughnut',
            data: { labels: ['Sudah Offering', 'Belum Offering'], datasets: [{ data: [1, 1], backgroundColor: ['#10b981', '#fbbf24'] }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { display: false } } }
        });

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    alert("Data berhasil di-sync!");
                }
            });
        }

        initDashboard();
    </script>
</body>
</html>
