<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status SO Berjalan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-[#116A7B] text-white min-h-screen">
    
    <div id="debug-log" class="hidden fixed top-0 w-full bg-red-600 text-white p-2 text-center text-sm z-50"></div>

    <div class="p-8">
        <h1 class="text-2xl font-bold mb-4">Status SO Berjalan</h1>
        
        <div class="bg-white text-slate-800 rounded-xl overflow-hidden shadow-xl">
            <table class="w-full">
                <thead class="bg-slate-100 border-b">
                    <tr id="so-table-head">
                        <th class="p-4">No</th>
                        <th class="p-4">Data</th>
                    </tr>
                </thead>
                <tbody id="so-table-body">
                    <tr><td colspan="2" class="p-10 text-center text-slate-500">Memuat sistem... (Pastikan gunakan Live Server!)</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        // Wrapper global untuk menangkap error
        window.onerror = function(msg, url, line) {
            const log = document.getElementById('debug-log');
            log.classList.remove('hidden');
            log.innerText = `Error: ${msg} (Baris: ${line})`;
            return false;
        };

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        console.log("Script dimuat...");

        // Inisialisasi aman
        const firebaseConfig = { /* ... isikan config Anda di sini ... */ };
        
        try {
            const app = initializeApp(firebaseConfig);
            console.log("Firebase terinisialisasi");
            
            // Coba render tabel dasar segera agar tidak kosong
            renderPlaceholder();
        } catch (e) {
            console.error("Gagal init Firebase:", e);
        }

        function renderPlaceholder() {
            const tbody = document.getElementById('so-table-body');
            if (tbody) tbody.innerHTML = '<tr><td colspan="2" class="p-10 text-center">Data belum tersedia. Silakan upload CSV.</td></tr>';
        }

        window.renderSOTable = function() {
            console.log("Render dipanggil");
            // ... (logika render Anda)
        }
    </script>
</body>
</html>
