<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMGROUP Internal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#148e9e', secondary: '#0d6470' } } } }
    </script>
</head>
<body class="bg-gradient-to-br from-primary to-secondary min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-10">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">SIMGROUP Login</h1>
            <p class="text-slate-500 text-sm mt-2">Masuk untuk monitoring data</p>
        </div>
        <form onsubmit="handleLogin(event)">
            <div id="error-message" class="hidden bg-red-50 text-red-500 text-sm p-3 rounded-xl mb-5 text-center border border-red-100">
                Username/Password salah!
            </div>
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
                <input type="text" id="username" required class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50">
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-secondary text-white font-semibold py-3.5 rounded-xl transition-all">Sign In</button>
        </form>
    </div>

    <script>
        const officerDatabase = {
            'daffa': { password: '1312', role: 'Area Operational Manager', name: 'Daffa' },
            'ali': { password: '1312', role: 'REVO FIF Jakarta', name: 'Ali' },
            'ilham': { password: '1312', role: 'REVO FIF Jakarta 2', name: 'Ilham' },
            'roky': { password: '1312', role: 'REVO FIF Taman Palem', name: 'Roky' },
            'indra': { password: '1312', role: 'REVO Multifinance Jakarta', name: 'Indra' },
            'edy': { password: '1312', role: 'Revo Adira Jakarta', name: 'Edy' },
            'simon': { password: '1312', role: 'RM Jakarta', name: 'Simon' }
        };

        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username').value.toLowerCase().trim();
            const passwordInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');

            if (officerDatabase[usernameInput] && officerDatabase[usernameInput].password === passwordInput) {
                // SIMPAN DENGAN KEY USERNAME AGAR BISA DICEK DI DASHBOARD
                const loggedInUser = { 
                    ...officerDatabase[usernameInput], 
                    username: usernameInput 
                };
                localStorage.setItem('currentUser', JSON.stringify(loggedInUser));
                window.location.href = 'dashboard-internal.html';
            } else {
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
